<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#142b63" />
  <title>Thông báo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="notices">
  <main class="app">
    <aside class="sidebar">
      <div class="identity">
        <div class="logo" aria-hidden="true">▦</div>
        <div><h1>Thời khóa biểu</h1><p>Cổng quản lý học tập</p></div>
      </div>
      <nav class="main-nav" aria-label="Menu chính">
        <a href="Quanlylichhoc.html#home">Trang chủ</a>
        <div class="nav-group">
          <button class="nav-toggle" id="scheduleMenuToggle" type="button" aria-expanded="true" aria-controls="scheduleSubmenu">
            <span>Thời khóa biểu</span><span class="nav-chevron" aria-hidden="true">⌄</span>
          </button>
          <div class="nav-submenu" id="scheduleSubmenu">
            <a href="Quanlylichhoc.html#scheduleSection">Lịch học</a>
            <a href="Lichthi.html">Lịch thi</a>
          </div>
        </div>
        <a class="active" href="Thongbao.html" aria-current="page">Thông báo</a>
      </nav>
      <div class="sidebar-account">
        <div class="profile">
          <div class="profile-avatar" id="profileAvatar">SV</div>
          <div><strong id="profileName">Sinh viên</strong><span id="profileEmail">Đã đăng nhập</span></div>
        </div>
        <div class="account-mode">
          <span class="account-mode-label" id="accountModeLabel">Chế độ: Sinh viên</span>
          <button class="mode-toggle" type="button" id="adminModeToggle" aria-pressed="false">Chuyển sang quản trị viên</button>
        </div>
        <button class="logout" type="button" id="logoutButton">Đăng xuất</button>
      </div>
    </aside>
    <section class="content" aria-labelledby="pageTitle">
      <header class="page-heading">
        <h2 id="pageTitle">Thông báo</h2>
        <p>Cập nhật những thông tin mới nhất từ nhà trường.</p>
      </header>
      <article class="card">
        <div class="card-heading">
          <h3>Thông báo mới nhất</h3>
          <button class="primary" type="button" id="addNotice">＋ Thêm thông báo</button>
        </div>
        <p class="empty-state" id="emptyState">Hiện chưa có thông báo mới.</p>
        <p class="form-error" id="listError" role="alert" aria-live="polite"></p>
        <div class="notice-list" id="noticeList" aria-live="polite"></div>
      </article>
    </section>
  </main>
  <div class="modal" id="noticeModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="dialog">
      <div class="dialog-head">
        <h3 id="modalTitle">Thêm thông báo</h3>
        <button class="close" type="button" id="closeModal" aria-label="Đóng">×</button>
      </div>
      <form id="noticeForm">
        <div class="field">
          <label for="noticeTitle">Tiêu đề</label>
          <input id="noticeTitle" name="title" required maxlength="120" placeholder="Nhập tiêu đề thông báo" />
        </div>
        <div class="field">
          <label for="noticeContent">Nội dung</label>
          <textarea id="noticeContent" name="content" required maxlength="3000" placeholder="Nhập nội dung thông báo"></textarea>
        </div>
        <p class="form-error" id="formError" role="alert" aria-live="polite"></p>
        <div class="form-actions">
          <button class="control" type="button" id="cancelModal">Hủy</button>
          <button class="primary" type="submit">Đăng thông báo</button>
        </div>
      </form>
    </div>
  </div>
    <script src="Thongbao.js"></script>
</body>
</html>
